on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    pull_request:
        branches:
            - main

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    test:
        runs-on: [self-hosted, build00]
        name: Run tests
        env:
            MIX_ENV: test
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Detect ImageOS (self-hosted runner)
              run: |
                  . /etc/os-release
                  case "${ID}-${VERSION_ID}" in
                    ubuntu-22.04) IMAGE_OS=ubuntu22 ;;
                    *)            IMAGE_OS=ubuntu24 ;;
                  esac
                  echo "ImageOS=${IMAGE_OS}" >> "${GITHUB_ENV}"

            # Toolchain versions come from .mise.toml. build00 is Debian, so tell
            # mise to use Bob's Ubuntu 24.04 OTP build instead of compiling from source.
            - name: Install toolchain with mise
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              env:
                  MISE_ERLANG_PRECOMPILED_OS: ubuntu-24.04
              with:
                  install_args: erlang elixir
                  cache: false

            - name: Install hex & rebar
              run: |
                  mix local.hex --force
                  mix local.rebar --force

            - name: Install dependencies
              run: mix deps.get

            - name: Run tests
              run: mix test

    release:
        runs-on: [self-hosted, build00]
        name: Build and release
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Detect ImageOS (self-hosted runner)
              run: |
                  . /etc/os-release
                  case "${ID}-${VERSION_ID}" in
                    ubuntu-22.04) IMAGE_OS=ubuntu22 ;;
                    *)            IMAGE_OS=ubuntu24 ;;
                  esac
                  echo "ImageOS=${IMAGE_OS}" >> "${GITHUB_ENV}"

            - name: Install toolchain with mise
              uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
              env:
                  MISE_ERLANG_PRECOMPILED_OS: ubuntu-24.04
              with:
                  install_args: erlang elixir
                  cache: false

            - name: Install hex & rebar
              run: |
                  mix local.hex --force
                  mix local.rebar --force

            - name: Install dependencies
              run: mix deps.get

            - name: Build hex package
              run: mix hex.build

            - name: Create GitHub release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  files: tussle-*.tar
                  generate_release_notes: true

    contrib-readme-job:
        runs-on: ubuntu-latest
        name: A job to automate contrib in readme
        needs: test
        if: github.ref == 'refs/heads/main'
        permissions:
          contents: write
          pull-requests: write
        steps:
            - name: Contribute List
              uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f # v2.3.11
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
